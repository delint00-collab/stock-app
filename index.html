<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>在庫管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
.product { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
button { margin: 5px; }
.zero { color: red; }
</style>
</head>
<body>

<h2>在庫管理</h2>
<div id="products"></div>

<script>
// --- Supabase 接続情報 ---
const supabaseUrl = "https://wonwgpsupqutrujcphwr.supabase.co";
const supabaseKey = "sb_publishable_6k-VYBGmKA9Jt1uZVlrPiA_QewueM51";

// --- 商品一覧読み込み ---
async function loadProducts() {
  const { data, error } = await window.supabase.from("products").select("*").order("name");
  if (error) { alert("Supabase接続エラー: " + error.message); return; }

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <strong onclick="copyJan('${product.jan}')">
        ${product.name}
      </strong><br>
      在庫: <span class="${product.stock === 0 ? 'zero' : ''}">
        ${product.stock}
      </span><br>
      更新: ${new Date(product.updated_at).toLocaleString()}<br>
      <button onclick="changeStock('${product.id}', ${product.stock + 1})">＋</button>
      <button onclick="changeStock('${product.id}', ${product.stock - 1})">−</button>
    `;
    container.appendChild(div);
  });
}

// --- 在庫変更 ---
async function changeStock(id, newStock) {
  if (newStock < 0) newStock = 0;
  const { error } = await window.supabase
    .from("products")
    .update({ stock: newStock, updated_at: new Date() })
    .eq("id", id);
  if (error) { alert("更新エラー: " + error.message); return; }
  loadProducts();
}

// --- JANコピー ---
function copyJan(jan) {
  navigator.clipboard.writeText(jan);
  alert("JANコードをコピーしました");
}

// --- Supabase 初期化 ---
if (!window.supabase._client) {
  window.supabase = supabase.createClient(supabaseUrl, supabaseKey);
}

// --- ページロード時に読み込み ---
loadProducts();
</script>

</body>
</html>
