<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>在庫管理（スマホ用）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: sans-serif;
  margin: 10px;
  padding: 0;
  max-width: 100%;
  background-color: #f9f9f9;
}
h2 { text-align: center; font-size: 24px; margin-bottom: 15px; }
.product {
  border: 1px solid #ccc;
  padding: 12px;
  margin-bottom: 12px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  width: 100%;
  box-sizing: border-box;
}
.product strong { font-size: 18px; cursor: pointer; }
.product span { font-size: 16px; }
button {
  font-size: 16px;
  padding: 10px 0;
  margin: 5px 2px;
  width: 48%;
  border-radius: 5px;
  border: none;
  background-color: #4CAF50;
  color: white;
}
button.minus { background-color: #f44336; }
button:active { opacity: 0.8; }
.zero { color: red; font-weight: bold; }
@media (min-width: 600px) {
  body { max-width: 600px; margin: 20px auto; }
}
</style>
</head>
<body>

<h2>在庫管理</h2>
<div id="products"></div>

<script>
// --- Supabase 接続 ---
const supabaseUrl = "https://wonwgpsupqutrujcphwr.supabase.co";
const supabaseKey = "sb_publishable_6k-VYBGmKA9Jt1uZVlrPiA_QewueM51";
const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

// --- 商品一覧読み込み ---
async function loadProducts() {
  const { data, error } = await mySupabase.from("products").select("*").order("name");
  if (error) { alert("Supabase接続エラー: " + error.message); return; }

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <strong onclick="copyJan('${product.jan}')">
        ${product.name}
      </strong><br>
      在庫: <span class="${product.stock === 0 ? 'zero' : ''}">
        ${product.stock}
      </span><br>
      更新: ${new Date(product.updated_at).toLocaleString()}<br>
      <div style="display:flex; justify-content: space-between;">
        <button onclick="changeStock('${product.id}', ${product.stock + 1})">＋</button>
        <button class="minus" onclick="changeStock('${product.id}', ${product.stock - 1})">−</button>
      </div>
    `;
    container.appendChild(div);
  });
}

// --- 在庫変更 ---
async function changeStock(id, newStock) {
  if (newStock < 0) newStock = 0;
  const { error } = await mySupabase
    .from("products")
    .update({ stock: newStock, updated_at: new Date() })
    .eq("id", id);
  if (error) { alert("更新エラー: " + error.message); return; }
  loadProducts();
}

// --- JANコードコピー ---
function copyJan(jan) {
  navigator.clipboard.writeText(jan);
  alert("JANコードをコピーしました");
}

// --- ページロード時に読み込み ---
loadProducts();
</script>

</body>
</html>
