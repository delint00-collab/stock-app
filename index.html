<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫管理（スマホ用）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: sans-serif;
  margin: 8px;
  padding: 0;
  max-width: 100%;
  background-color: #f9f9f9;
}
h2 { text-align: center; font-size: 28px; margin-bottom: 15px; }

.product {
  border: 1px solid #ccc;
  padding: 14px;
  margin-bottom: 12px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
  width: 100%;
  box-sizing: border-box;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.product strong {
  font-size: 22px;
  cursor: pointer;
}

.edit-btn {
  font-size: 14px;
  padding: 4px 8px;
  background-color: #2196F3;
  width: auto;
}

.stock-number {
  font-size: 20px;
}

button {
  font-size: 12px;
  padding: 6px 0;
  margin: 4px 2px;
  width: 42%;
  border-radius: 5px;
  border: none;
  background-color: #4CAF50;
  color: white;
}

button.minus { background-color: #f44336; }
button:active { opacity: 0.8; }

.zero { color: red; font-weight: bold; }

@media (min-width: 600px) {
  body { max-width: 600px; margin: 20px auto; }
}
  
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 16px;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.toast.show {
  opacity: 1;
}
  
</style>
</head>

<body>

<h2>バック在庫</h2>
<div id="products"></div>

<script>
<script>
// --- Supabase 接続 ---
const supabaseUrl = "https://wonwgpsupqutrujcphwr.supabase.co";
const supabaseKey = "sb_publishable_6k-VYBGmKA9Jt1uZVlrPiA_QewueM51";
const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

// --- 商品一覧読み込み ---
async function loadProducts() {
  const { data, error } = await mySupabase
    .from("products")
    .select("*")
    .order("name");

  if (error) {
    alert("Supabase接続エラー: " + error.message);
    return;
  }

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <div class="top-row">
        <strong onclick="copyJan('${product.jan}')">
          ${product.name}
        </strong>
        <button class="edit-btn"
          onclick="startEdit('${product.id}')">
          ✏️
        </button>
      </div>

      <div id="edit-${product.id}" style="display:none; margin-top:8px;">
        <input type="text"
          id="input-${product.id}"
          value="${product.name}"
          style="width:65%; padding:4px; font-size:14px;">
        <button onclick="saveEdit('${product.id}')"
          style="width:30%; font-size:12px;">保存</button>
      </div>

      在庫:
      <span class="stock-number ${product.stock === 0 ? 'zero' : ''}">
        ${product.stock}
      </span><br>

      更新: ${new Date(product.updated_at).toLocaleString()}<br>

      <div style="display:flex; justify-content: space-between; margin-top:6px;">
        <button onclick="changeStock('${product.id}', ${product.stock + 1})">＋</button>
        <button class="minus" onclick="changeStock('${product.id}', ${product.stock - 1})">−</button>
      </div>
    `;

    container.appendChild(div);
  });
}

// ✅ ここから外に出す
function startEdit(id) {
  const box = document.getElementById("edit-" + id);
  if (box) box.style.display = "block";
}

async function saveEdit(id) {
  const newName = document.getElementById("input-" + id).value.trim();
  if (!newName) return;

  const { error } = await mySupabase
    .from("products")
    .update({ name: newName, updated_at: new Date() })
    .eq("id", id);

  if (error) {
    showToast("更新エラー");
    return;
  }

  showToast("商品名を更新しました");
  loadProducts();
}

// --- 在庫変更 ---
async function changeStock(id, newStock) {
  if (newStock < 0) newStock = 0;

  const { error } = await mySupabase
    .from("products")
    .update({ stock: newStock, updated_at: new Date() })
    .eq("id", id);

  if (error) {
    alert("更新エラー: " + error.message);
    return;
  }

  loadProducts();
}

// --- JANコピー ---
function copyJan(jan) {
  navigator.clipboard.writeText(jan);
  showToast("JANコードをコピーしました");
}

// --- トースト表示 ---
function showToast(message) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = message;

  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add("show"), 10);

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 200);
  }, 1200);
}

// --- ページロード時 ---
loadProducts();
</script>
